<!--
  mlm/mlm-swap-quiz/mlm-swap-info
  THE 'MORE INFO FROM YOUR REP' STEP, in place of the company's product pages (Jeff, 2026-11-10: names the thing
  plainly, never a brand; the shop button shows only when the rep set a shop link). ITS VIEW IS THE HOT LEAD ALERT.
  Message goes through /mlm-swap-redirect-dm (the DM alert), the shop button through /mlm-swap-shop (the fire lead alert).
  Marketing Shark | MLM (company-neutral): "One Swap Per Room" (a 6 question quiz plus a room by room checklist).
  Built from a home swaps quiz and its 27 swap guide (named in migration 0702). No company, product or brand name
  anywhere, in the page or in these notes; no "toxic" scare line, no germ-kill number, no disease claim about a
  chemical. Platform only: migrations 0702 (pages) and 0703 (follow-ups).
-->
<div class="rl rl-look-soft rl-skin rlr mlm-info" data-pf-native data-pf-arrive="#F4EEE6"
  data-pf-say="Hey {first}, I took the room by room quiz, can you send me more info on the home products you recommend?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <span class="rl-eyebrow" data-in>What I recommend</span>
          <h1 class="rlr-big" data-in style="--d:.05s">Want more info on the products I recommend for the home?</h1>
          <p data-in style="--d:.1s">Message me and I'll tell you what each one is and why I picked it. No pressure either way.</p>
          <div class="rl-btns" data-in style="--d:.2s">
            <a class="rl-btn" data-pf-ask data-pf-message-link data-needs="{{custom_values.mlm_rep_messenger}}" href="/mlm-swap-redirect-dm">Message {{custom_values.mlm_rep_first_name}}</a>
            <a class="rl-btn rl-btn-2" data-pf-text-link data-pf-message-link data-needs="{{custom_values.mlm_rep_sms}}" href="sms:{{custom_values.mlm_rep_sms}}?&amp;body=Hey%2C%20I%20took%20the%20room%20by%20room%20quiz%2C%20can%20you%20send%20me%20more%20info%20on%20the%20home%20products%20you%20recommend%3F">Text me instead</a>
            <a class="rl-btn rl-btn-2" data-needs="{{custom_values.mlm_buy_link}}" href="/mlm-swap-shop">See it in my shop</a>
          </div>
          <p class="rl-fine mlm-ind" data-in style="--d:.3s">{{custom_values.mlm_independence_line}}</p>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/reel/v1/reel.js?v=5" defer></script>
