<!--
  quantaira/watch/learn-more: page 2 (/learn-more). Jeff, 2026-10-01: "headline, video, two
  buttons, one is watch the launch webinar ... another is download the app (which takes them to
  reps replicated link)". /get-the-app and /message-me are redirect steps to the rep's own values.
  COPY: Jeff, 2026-10-01: a "Step" pill on top, page 1 "Watch this short overview" with "Watch the full explainer"; pages 2 and 3 drafted to match, waiting on his OK. The button words are Jeff's.
  WORDS (0126): every word a person reads comes from words/{language}.json next to these pages, in
  the language the rep picked for them; en.json is the default and fills any gap. data-label is the
  English the rep is told ("John tapped Download the app"), whatever language the page is in.
-->
<main class="qp">
  <span class="qp-pill">{{words.learn_pill}}</span>
  <h1 data-label="Here's the full explainer">{{words.learn_h1_a}} <span class="qp-grad" data-fit>{{words.learn_h1_b}}</span></h1>
  <div class="qv" data-video="{{custom_values.quantaira_video_learn}}" data-name="the full explainer" data-soon="{{words.video_soon}}"></div>
  <div class="qp-acts col">
    <a class="qp-btn" href="/webinar" data-label="Watch the launch webinar">{{words.learn_next}}</a>
    <a class="qp-btn grad" href="/get-the-app" data-label="Download the app">{{words.learn_app}}</a>
  </div>
  <p class="qp-ask"><a href="/message-me" data-label="Questions? Ask me about this"><span aria-hidden="true">💬</span> {{words.ask}}</a></p>
</main>
