<!--
  bepic/b-greens-breakfast/b-greens-breakfast-list-request
  The page a lead lands on after tapping "🎁 YES! Message me the list + product info" with no script (the
  confirmation reel's block.js opens its popup instead and fetches this step). Ported from bepic/b-crash-plan.
  ⚠️ ITS VIEW IS THE ALERT ("B-Epic - The Greens at Breakfast Recipe Guide - List Request"). Known leads only; once per lead.
  ⚠️ THE WORDS ARE CONFIRM.done in BEPICSHARK/campaigns/greens-breakfast/copy.mjs. No company name, no code, no price.
-->
<div class="rl rl-look-poster rl-gp rlr" data-pf-native data-pf-arrive="#0B0B0B">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <!-- The page's title (render.mjs deriveMeta takes the first h1): read by a screen reader and the browser tab, not shown. -->
          <h1 style="position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap">My Morning Supplement List</h1>
          <div class="lk-card">
            <span class="rlr-pill" data-in>✅ Done<span data-if-name>, {{contact.first_name}}</span>.</span>
            <p class="rlr-big" data-in style="--d:.1s">We'll message you the <b>supplement list</b> AND <b>product info within 24 hours</b> (usually much sooner!).</p>
            <p data-in style="--d:.2s">Keep an eye on your texts and Facebook messages, including your <b>“Unknown Senders”</b> and <b>“Message Requests”</b> folders, so you don't miss it!</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
