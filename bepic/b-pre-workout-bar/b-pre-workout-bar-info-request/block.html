<!--
  bepic/b-pre-workout-bar/b-pre-workout-bar-info-request
  The page a lead lands on after tapping "🎁 YES! Message me the product info" with no script (the confirmation reel's
  block.js opens its popup instead and fetches this step). Ported from bepic/b-greens-breakfast's list request.
  ⚠️ ITS VIEW IS THE ALERT ("B-Epic - The Pre-Workout Bar - Info Request"). Known leads only; once per lead.
  ⚠️ THE WORDS ARE CONFIRM.done in BEPICSHARK/campaigns/pre-workout-bar/copy.mjs. No company name, no code, no price.
-->
<div class="rl rl-look-tracker rl-pw rlr" data-pf-native data-pf-arrive="#0B0D10">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <!-- The page's title (render.mjs deriveMeta takes the first h1): read by a screen reader and the browser tab, not shown. -->
          <h1 style="position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap">The ready-made one I drink</h1>
          <div class="pw-panel">
            <span class="rlr-pill" data-in>✅ Done<span data-if-name>, {{contact.first_name}}</span>.</span>
            <p class="rlr-big" data-in style="--d:.1s">We'll message you the <b>product info within 24 hours</b> (usually much sooner!).</p>
            <p data-in style="--d:.2s">Keep an eye on your texts and Facebook messages, including your <b>“Unknown Senders”</b> and <b>“Message Requests”</b> folders, so you don't miss it!</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/reel/v1/reel.js?v=6" defer></script>
