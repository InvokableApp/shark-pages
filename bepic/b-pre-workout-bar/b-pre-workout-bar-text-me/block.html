<!--
  bepic/b-pre-workout-bar/b-pre-workout-bar-text-me
  Where the "🎁 Text me the product info" buttons in this campaign's emails go. Ported from
  bepic/b-greens-breakfast/b-greens-breakfast-text-me (2026-11-17), the words from copy.mjs TEXTME.
  ⚠️ ITS VIEW IS AN ALERT ("B-Epic - The Pre-Workout Bar - Text Me"). Known leads only; once per lead.
  No company name, no product name in the lead's words, no code (PAGE-COPY-SOP rule 14).
-->
<div class="rl rl-look-tracker rl-pw rlr" data-pf-native data-tm data-pf-arrive="#0B0D10"
  data-pf-say="Hey {first}, I downloaded The Pre-Workout Bar, can you send me the info on the ready-made one you drink?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <div class="pw-panel">
            <h1 class="rlr-big" data-in>Message me<span data-if-name>, {{contact.first_name}},</span> and I'll send you <b>the ready-made one I drink</b>.</h1>
            <p data-in style="--d:.1s">The message is written for you. Tap send and it comes straight to me.</p>
            <span class="tm-bubble" data-in data-tm-words style="--d:.2s"></span>
            <div class="rl-btns" data-in style="--d:.3s">
              <a class="rl-btn" data-tm-text data-pf-text-link data-needs="{{custom_values.bepic_rep_phone}}" href="sms:{{custom_values.bepic_rep_phone}}">💬 Send it as a text</a>
              <a class="rl-btn rl-btn-2" data-pf-ask data-pf-message-link data-needs="{{custom_values.bepic_rep_messenger}}" href="https://{{custom_values.bepic_rep_messenger}}">Message me on Facebook</a>
            </div>
            <p class="tm-desk" data-tm-desk hidden>Or text it to <b data-tm-num>{{custom_values.bepic_rep_phone}}</b> from your phone.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/text-me/v1/text-me.js?v=1" defer></script>
<script src="/_p/_shared/reel/v1/reel.js?v=6" defer></script>
