<!--
  bepic/b-your-links/b-links: Epic Shark's PUBLIC link hub, the page a rep posts in their social bio. Forked from
  nueva/n-your-links/n-links 2026-11-17. The rep console is the app's My funnels, not this page.
-->
<div class="sk-bep-links"
     data-words=""
     data-cv-bepic_main_url="{{custom_values.bepic_main_url}}"
     data-cv-bepic_rep_full_name="{{custom_values.bepic_rep_full_name}}"
     data-cv-bepic_buy_link="{{custom_values.bepic_buy_link}}"
     data-cv-bepic_opportunity_url="{{custom_values.bepic_opportunity_url}}"
     data-cv-bepic_income_disclaimer="{{custom_values.bepic_income_disclaimer}}"
     data-cv-bepic_facebook="{{custom_values.bepic_facebook}}"
     data-cv-bepic_instagram="{{custom_values.bepic_instagram}}"
     data-cv-bepic_tiktok="{{custom_values.bepic_tiktok}}"
     data-cv-bepic_youtube="{{custom_values.bepic_youtube}}">
  <div class="sk-grain" aria-hidden="true"></div>

  <header class="sk-head">
    <h1 class="sk-name" data-name></h1>
    <p class="sk-sub" data-sub></p>
  </header>

  <main class="sk-body" data-body></main>

  <footer class="sk-foot">
    <p class="sk-legal" data-legal></p>
  </footer>
</div>
