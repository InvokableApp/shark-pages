<!-- beneve / beneve-water-report / b-water-results
     The report on its own URL, so it can be shared, re-opened and re-sent by the rep.
     Page 1 renders inline and hands off here on form submit. -->
<div class="sk-wat sk-wat-results"
     data-api="https://water-api-production-c8d2.up.railway.app"
     data-rep="{{custom_values.beneve_rep_full_name}}"
     data-guide="https://{{custom_values.beneve_three_day_swap_guide_pdf_url}}"
     data-messenger="{{custom_values.beneve_rep_messenger}}"
     data-dm-step="b-water-dm-redirect">
  <div class="sk-wat-out"><div class="sk-wat-result" aria-live="polite"></div></div>
</div>
