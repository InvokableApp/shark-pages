<!--
  beneve/beneve-skin-diagnostic/b-skin-guide-text-me
  Where the "text me for the skin guide" button in the Skin Diagnostic's emails goes (REEL-PAGE-SOP §The email's text me
  page; Jeff, 2026-10-24, "every email that has this button"). The lead's message is written for them; one tap texts it
  to the rep, or it goes by Messenger through the copy-the-message card. _shared/text-me/v1 does the work.
  ⚠️ ITS VIEW IS AN ALERT: the step /b-skin-guide-text-me starts "Beneve - Skin Diagnostic - Text Me", which tags the lead,
     marks them hot, and tells the rep to look for their text, with the reply ready. Known leads only; once per lead.
  Built on the Hormone Lunchbox text me page (b-hormone-supplement-text-me); the look is the skin request page's.
-->
<div class="rl rl-look-soft rl-skin rlr" data-pf-native data-tm data-pf-arrive="#F4EEE6"
  data-pf-say="Hey {first}, I took the skin quiz, can you send me the skin guide and more info on Luxe?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <h1 class="rlr-big" data-in>Text me<span data-if-name>, {{contact.first_name}},</span> and I'll send you the <b>skin guide</b> and the <b>Luxe info</b>.</h1>
          <p data-in style="--d:.1s">The message is written for you. Tap send and it comes straight to me.</p>
          <span class="tm-bubble" data-in data-tm-words style="--d:.2s"></span>
          <div class="rl-btns" data-in style="--d:.3s">
            <a class="rl-btn" data-tm-text data-pf-text-link data-needs="{{custom_values.beneve_rep_phone}}" href="sms:{{custom_values.beneve_rep_phone}}">💬 Send it as a text</a>
            <a class="rl-btn rl-btn-2" data-pf-ask data-pf-message-link data-needs="{{custom_values.beneve_rep_messenger}}" href="https://{{custom_values.beneve_rep_messenger}}">Message me on Facebook</a>
          </div>
          <p class="tm-desk" data-tm-desk hidden>Or text it to <b data-tm-num>{{custom_values.beneve_rep_phone}}</b> from your phone.</p>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/text-me/v1/text-me.js?v=1" defer></script>
<script src="/_p/_shared/reel/v1/reel.js?v=5" defer></script>
