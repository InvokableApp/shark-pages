<!--
  mpg/m-vagus-reset/m-vagus-reset-text-me
  Where the "💬 Text me for the guide + product info" button in every Vagus Nerve Reset email goes (Jeff, 2026-10-24:
  "make the button prefill a sms ... or take them to a page where they can choose to fb message or sms the rep with a
  prefilled message"). The lead's message is written for them ("hey, i downloaded the ____ guide, can you send me the
  companion guide and more info on the product?"): one tap texts it to the rep, or it goes by Messenger through the
  copy-the-message card. _shared/text-me/v1 does the work; references/REEL-PAGE-SOP.md §The email's text me page.
  ⚠️ ITS VIEW IS AN ALERT: the step /m-vagus-reset-text-me starts "MPG - Vagus Nerve Reset - Text Me" (0505), which
  tags the lead, marks them hot, and tells the rep to look for their text, with the reply ready. Known leads only (the
  email link names them); once per lead. The thank-you page's own ask (/m-vagus-reset-bonus) is unchanged.
  The look is the bonus page's (one screen of the confirmation's).
-->
<div class="rl rl-vagus cf-bonus" data-pf-native data-tm data-pf-arrive="#FBF7EE"
  data-pf-say="Hey {first}, I downloaded the Vagus Nerve Reset guide, can you send me the supplement companion guide and more info on the product?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-tint rl-wide cf-deliver is-on">
        <div class="rl-in">
          <h1 class="cf-claim-big" data-in>Text me<span data-if-name>, {{contact.first_name}},</span> and I'll send you the <b>supplement companion guide</b> and the <b>product info</b>.</h1>
          <p data-in style="--d:.1s">The message is written for you. Tap send and it comes straight to me.</p>
          <span class="tm-bubble" data-in data-tm-words style="--d:.2s"></span>
          <div class="rl-btns" data-in style="--d:.3s">
            <a class="rl-btn" data-tm-text data-pf-text-link data-needs="{{custom_values.mpg_rep_phone}}" href="sms:{{custom_values.mpg_rep_phone}}">💬 Send it as a text</a>
            <a class="rl-btn rl-btn-2" data-pf-ask data-pf-message-link data-needs="{{custom_values.mpg_rep_messenger}}" href="https://{{custom_values.mpg_rep_messenger}}">Message me on Facebook</a>
          </div>
          <p class="tm-desk" data-tm-desk hidden>Or text it to <b data-tm-num>{{custom_values.mpg_rep_phone}}</b> from your phone.</p>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/text-me/v1/text-me.js?v=1" defer></script>
<script src="/_p/_shared/reel/v1/reel.js?v=4" defer></script>
