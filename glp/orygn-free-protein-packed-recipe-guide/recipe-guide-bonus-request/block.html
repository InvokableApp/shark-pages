<!--
  glp/orygn-free-protein-packed-recipe-guide/recipe-guide-bonus-request
  Where a lead lands after tapping the claim button on the recipe guide's bonus reel with no script running (with it, the
  reel fetches this step in the background and shows the same words in its popup). Platform only. ⚠️ ITS VIEW IS THE
  ALERT: /recipe-guide-bonus-request starts "High Protein Recipe Guide Lead Mag - Bonus Request" (migration 0748). The
  words are the reel's popup, as glp-food-guide-bonus-request.
-->
<div class="rl rl-pf rlb-root rlr" data-pf-native data-pf-arrive="#f6f2ea">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <span class="rlb-pill" data-in>✅ Done<span data-if-name>, {{contact.first_name}}</span>.</span>
          <p class="rlb-claim-big" data-in style="--d:.1s">We'll send you the <b>workout guide</b> AND <b>product info via text message within 24 hours</b> (usually much sooner!).</p>
          <p data-in style="--d:.2s">Be sure to check your text messages, including your <b>“Unknown Senders” folder</b>, so you don't miss it!</p>
        </div>
      </section>
    </div>
  </div>
</div>
