<!--
  nueva/n-greens-breakfast/n-greens-breakfast-text-me
  Where the "text me for the supplement list" button in this campaign's emails goes (REEL-PAGE-SOP §The email's text me
  page; Jeff, 2026-10-24). The lead's message is written for them (Jeff's template: "Hey {first}, I downloaded the <guide>,
  can you send me the <bonus> and more info on the product?"): one tap texts it to the rep, or it goes by Messenger through
  the copy-the-message card. _shared/text-me/v1 does the work. Copied from n-tone-and-tighten-text-me.
  ⚠️ ITS VIEW IS AN ALERT: the step /n-greens-breakfast-text-me starts "Nueva - Greens at Breakfast Guide - Text Me"
  (migration 0641), which tags the lead, marks them hot, and tells the rep to look for their text, with the reply ready.
  Known leads only (the email link names them); once per lead. No code (PAGE-COPY-SOP rule 14). The look is the
  list request page's.
-->
<div class="rl rl-look-tin rl-gb rlr" data-pf-native data-tm data-pf-arrive="#F7F3E8"
  data-pf-say="Hey {first}, I downloaded the Greens at Breakfast Recipe Guide, can you send me the morning supplement list and more info on the greens you use?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on">
        <div class="rl-in">
          <div class="lk-card gb-card">
            <h1 class="rlr-big" data-in>Text me<span data-if-name>, {{contact.first_name}},</span> and I'll send you the <b>supplement list</b> and <b>more info on the greens I use</b>.</h1>
            <p data-in style="--d:.1s">Your message is ready. Tap send and it comes straight to me.</p>
            <span class="tm-bubble" data-in data-tm-words style="--d:.2s"></span>
            <div class="rl-btns" data-in style="--d:.3s">
              <a class="rl-btn" data-tm-text data-pf-text-link data-needs="{{custom_values.nueva_rep_phone}}" href="sms:{{custom_values.nueva_rep_phone}}">💬 Send it as a text</a>
              <a class="rl-btn rl-btn-2" data-pf-ask data-pf-message-link data-needs="{{custom_values.nueva_rep_messenger}}" href="https://{{custom_values.nueva_rep_messenger}}">Message me on Facebook</a>
            </div>
            <p class="tm-desk" data-tm-desk hidden>Or text it to <b data-tm-num>{{custom_values.nueva_rep_phone}}</b> from your phone.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/_p/_shared/text-me/v1/text-me.js?v=1" defer></script>
<script src="/_p/_shared/reel/v1/reel.js?v=6" defer></script>
