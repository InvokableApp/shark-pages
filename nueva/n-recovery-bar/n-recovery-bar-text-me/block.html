  ⚠️ ITS VIEW IS AN ALERT: the step /n-recovery-bar-text-me starts "Nueva - The Recovery Bar - Text Me" (migration 0643), which tags

<div class="rl rl-look-fruit rl-rb rlr rb-s-fall" data-pf-native data-tm data-pf-arrive="#FBF7F0"
  data-pf-say="Hey {first}, I downloaded The Recovery Bar, can you send me this season's drop and more info on Revive?">
  <div class="rl-frame">
    <div class="rl-track">
      <section class="rl-p rl-paper rl-wide is-on" style="--fruit:#F6D9D6">
        <div class="rl-in">
          <div class="lk-card">
            <h1 class="rlr-big" data-in>Text me<span data-if-name>, {{contact.first_name}},</span> and I'll send you <b>this season's drop</b> and <b>more info on Revive</b>.</h1>
            <p data-in style="--d:.1s">The message is written for you. Tap send and it comes straight to me.</p>
            <span class="tm-bubble" data-in data-tm-words style="--d:.2s"></span>
            <div class="rl-btns" data-in style="--d:.3s">
              <a class="rl-btn" data-tm-text data-pf-text-link data-needs="{{custom_values.nueva_rep_phone}}" href="sms:{{custom_values.nueva_rep_phone}}">💬 Send it as a text</a>
              <a class="rl-btn rl-btn-2" data-pf-ask data-pf-message-link data-needs="{{custom_values.nueva_rep_messenger}}" href="https://{{custom_values.nueva_rep_messenger}}">Message me on Facebook</a>
            </div>
            <p class="tm-desk" data-tm-desk hidden>Or text it to <b data-tm-num>{{custom_values.nueva_rep_phone}}</b> from your phone.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
