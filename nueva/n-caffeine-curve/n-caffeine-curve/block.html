<!--
  nueva/n-caffeine-curve/n-caffeine-curve
  The Caffeine Curve. Second preset of the shared calculator mechanism.

  WHAT THIS IS FOR. It estimates how much caffeine is still circulating when the visitor gets into
  bed, from what she drinks and when. Campaign premise and the reasoning behind it:
  references/CAMPAIGN-PREMISE-STRATEGY.md and NUEVASHARK/FUNNEL-PLAN.md B8.

  WHY THIS PREMISE AND NOT "HOW TO AVOID THE 3PM CRASH". A behavioural premise implies the fix is
  her habits, so a supplement payoff contradicts it and reads as a rug pull. This premise is
  circumstantial: the effect is real, measured, and she cannot perceive it. That is the finding the
  whole campaign rests on, and it is the paper's own words, not ours:

    Drake C, Roehrs T, Shambroom J, Roth T. "Caffeine Effects on Sleep Taken 0, 3, or 6 Hours
    before Going to Bed." J Clin Sleep Med. 2013. Randomised, double blind, placebo controlled
    crossover, 12 healthy adults, 400 mg.
      - 400 mg six hours before bed cost about 68 minutes of total sleep.
      - "Caffeine-induced sleep disturbance was detected by both the self-report diary and
        objective sleep measures when taken at bedtime and 3 hours prior to bedtime, whereas ONLY
        THE OBJECTIVE MEASURE detected differences when caffeine was taken 6 hours prior to
        bedtime."
      - The authors call for "continued education regarding the sleep disruptive effects of
        caffeine", which is what this tool is.
    https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807/

  ⚠️ WHAT IT DELIBERATELY DOES NOT DO.
    - It does not tell her she has a sleep disorder, is caffeine dependent, or is deficient in
      anything. It estimates a milligram figure and says what the published research measured at
      similar levels.
    - It does not tell her to stop drinking caffeine, or to stop after a given hour. That would be
      behavioural advice, and a caffeine product then argues against the tool that produced it.
      The whole campaign turns on changing WHAT the late dose is, never on removing it. If a future
      edit adds a "cut caffeine after 2pm" line, the campaign is broken, not improved.
    - It does not claim she will lose 68 minutes of sleep. The study measured that, at 400 mg, in
      twelve people. The bands say what was measured, never what will happen to her.

  ⚠️ THE NUMBERS, AND WHICH OF THEM ARE OURS.
    - mgPerDrink comes from the FDA's published per 12 fluid ounce figures, midpoint where a range
      is given. Traceable, public, and names no brand.
      https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much
    - halfLifeHours 5 is a population average and the spread between people is large. Drake 2013:
      recommendations on when to stop "vary widely from 4 to 11 hours prior to bedtime". The
      disclaimer says so on the page.
    - windowHour is OURS. It is where we place a dose the visitor described only as "morning" or
      "midday", and it is the most arguable thing here after the half life.
    - The band thresholds are OURS. 160 is set near where the study's own condition lands: 400 mg
      six hours out, decayed at a 5 hour half life, leaves about 174 mg at bedtime.
    Jeff and Joe: these are the numbers to argue with. All of them are in `constants` and `bands`,
    none are in code.

  🚧 THE CTA IS PROVISIONAL. It opens the page's own popup, and the popup copy is BLOCKED on two
  things (NUEVASHARK/FUNNEL-PLAN.md B8): Nueva's supplement facts panel, because the offer is a
  dose and timing argument and Beyond Daily's caffeine mg is unknown, and sign off on the
  "burn fat naturally" claim strength. Nothing in this block makes a product claim, so the
  diagnostic half can be reviewed and shipped while that is chased.

  ⚠️ SELLS BEYOND DAILY, NEVER ADVANCED. Beyond Advanced stacks alpha yohimbine on a 98% caffeine
  extract. Putting it behind a page about sleeping better is the rug pull arriving late.

  ⚠️ NOT REVIEWED YET. _shared/calculator/v1/README.md: a calculator that outputs a health figure
  needs a human reviewer before it ships, and must carry a disclaimer. It carries one. It has not
  had the reviewer.

  Design lives in _shared/calculator/v1/ under .sk-calc. This file holds the config and markup;
  block.css holds only this preset's palette tokens. No em-dashes anywhere in the copy.
-->

      "greenTea": 37,
